[package]
name = "music-shell"
version = "0.4.9"
edition = "2024"
description = "终端音乐播放器：JSON 配置驱动，菜单式交互，rodio 播放本地音频"
license = "MIT"
keywords = ["music", "player", "cli", "terminal", "tui"]
categories = ["command-line-utilities", "multimedia::audio"]

[lib]
name = "music_shell"
path = "src/lib.rs"

[[bin]]
name = "music-shell"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
flate2 = "1.1.10"
rand = "0.9"
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "mp3",
    "flac",
    "wav",
    "vorbis",
    "mp4",
    "symphonia-aiff",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
terminal_size = "0.4.4"
ureq = { version = "3.4.2", features = ["rustls", "json", "socks-proxy"] }
walkdir = "2.5.0"
zip = "9.0.5"

[profile.release]
opt-level = 2
