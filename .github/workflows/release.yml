name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "版本号怎么升（none = 用 Cargo.toml 里现有的版本）"
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      dry-run:
        description: "只做检查和构建，不提交、不发布"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: 定版本、打 tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 定出版本号并按需更新 Cargo.toml
        id: plan
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "Cargo.toml 当前版本: $declared"

          trigger="${{ github.event_name }}"
          if [ "$trigger" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "由 tag 触发，版本取自 tag: $version"
          else
            case "${{ inputs.bump }}" in
              major) version=$(python3 -c "import sys;m=sys.argv[1].split('.');print(f'{int(m[0])+1}.0.0')" "$declared") ;;
              minor) version=$(python3 -c "import sys;m=sys.argv[1].split('.');print(f'{m[0]}.{int(m[1])+1}.0')" "$declared") ;;
              patch) version=$(python3 -c "import sys;m=sys.argv[1].split('.');print(f'{m[0]}.{m[1]}.{int(m[2])+1}')" "$declared") ;;
              *)    version="$declared" ;;
            esac
            echo "本次发布版本: $version"
            if [ "$version" != "$declared" ]; then
              python3 scripts/set-version.py "$version"
              git config user.name "github-actions[bot]"

              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add Cargo.toml Cargo.lock
              git commit -m "版本号 $declared → $version"
              if [ "${{ inputs.dry-run }}" = "true" ]; then
                echo "dry-run：不推送"
              else
                git push origin HEAD:main
                echo "已推送版本变更"
              fi
            fi
          fi

          tag="v$version"
          publish=true
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，跳过发布"
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: 创建 tag（不存在才建）
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 已存在"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "release $TAG"
            git push origin "$TAG"
            echo "已创建并推送 tag $TAG"
          fi

  release:
    name: build and publish
    needs: meta
    if: needs.meta.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: music-shell
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: music-shell
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: music-shell
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: music-shell.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          MS_VERSION: ${{ needs.meta.outputs.version }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: 校验产物里的版本号和 tag 一致
        if: runner.os != 'Windows'
        env:
          EXPECTED: ${{ needs.meta.outputs.version }}
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          got=$("$bin" --version | awk '{print $2}')
          if [ "$got" != "$EXPECTED" ]; then
            echo "::error::产物版本是 $got，但应该是 $EXPECTED"
            exit 1
          fi
          echo "产物版本 $got，与 tag 一致"

      - name: Package (unix)
        if: runner.os != 'Windows'
        env:
          BIN: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cp "target/${{ matrix.target }}/release/$BIN" .
          printf '%s\n' \
            '# music-shell' \
            '' \
            '用法: ./music-shell --help' \
            '配置文件默认位于 ~/.config/music-shell/config.json' \
            'Debian/Ubuntu 需要 ALSA 运行库: sudo apt install libasound2' \
            > README.txt
          tar czf "music-shell-${{ matrix.target }}.$ARCHIVE" "$BIN" README.txt
          rm -f "$BIN" README.txt

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item "target/${{ matrix.target }}/release/music-shell.exe" .
          Compress-Archive -Path music-shell.exe -DestinationPath "music-shell-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-shell-${{ matrix.target }}
          path: music-shell-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: attach to release
    needs: [meta, release]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*
