name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: 解析版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 以 tag 为准确定版本
        id: ver
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          if [ -z "$version" ]; then
            echo "::error::无法从 ref $tag 解析出版本号"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "产物版本: $version（来自 tag $tag）"
      - name: 对比 Cargo.toml，有漂移只提示不拦截
        run: |
          declared=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$declared" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::warning::Cargo.toml 写的是 $declared，但 tag 是 ${{ steps.ver.outputs.version }}。产物按 tag 走（${{ steps.ver.outputs.version }}）。"
          else
            echo "Cargo.toml 与 tag 一致"
          fi

  release:
    needs: meta
    name: build and publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: music-shell
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: music-shell
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: music-shell
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: music-shell.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          MS_VERSION: ${{ needs.meta.outputs.version }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        env:
          BIN: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cp "target/${{ matrix.target }}/release/$BIN" .
          printf '%s\n' \
            '# music-shell' \
            '' \
            '用法: ./music-shell --help' \
            '配置文件默认位于 ~/.config/music-shell/config.json' \
            'Debian/Ubuntu 需要 ALSA 运行库: sudo apt install libasound2' \
            > README.txt
          tar czf "music-shell-${{ matrix.target }}.$ARCHIVE" "$BIN" README.txt
          rm -f "$BIN" README.txt

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item "target/${{ matrix.target }}/release/music-shell.exe" .
          Compress-Archive -Path music-shell.exe -DestinationPath "music-shell-${{ matrix.target }}.zip"

      - name: 校验产物里的版本号和 tag 一致
        if: runner.os != 'Windows'
        env:
          EXPECTED: ${{ needs.meta.outputs.version }}
        run: |
          got=$(./music-shell --version | awk '{print $2}')
          if [ "$got" != "$EXPECTED" ]; then
            echo "::error::产物版本是 $got，但 tag 版本是 $EXPECTED"
            exit 1
          fi
          echo "产物版本 $got，与 tag 一致"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-shell-${{ matrix.target }}
          path: music-shell-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: attach to release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
      - name: 附加自动生成的变更日志
        if: always()
        continue-on-error: true
        run: gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || true