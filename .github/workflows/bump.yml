name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "版本号怎么升"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry-run:
        description: "只打印不提交"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  bump:
    name: 升版本号并提交
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 升版本号
        id: bump
        run: |
          current=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          major=$(echo "$current" | cut -d. -f1)
          minor=$(echo "$current" | cut -d. -f2)
          patch=$(echo "$current" | cut -d. -f3 | cut -d- -f1)
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          echo "当前 $current → 新版本 $next"
          echo "old=$current" >> "$GITHUB_OUTPUT"
          echo "new=$next" >> "$GITHUB_OUTPUT"
          sed -i "0,/^version = \".*\"/s//version = \"$next\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: 提交并推送
        if: ${{ !inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "版本号 ${{ steps.bump.outputs.old }} → ${{ steps.bump.outputs.new }}"
          git push origin HEAD:main
          echo "已推送，Auto Tag 会自动打 v${{ steps.bump.outputs.new }} 并触发发布"

      - name: 仅预览
        if: ${{ inputs.dry-run }}
        run: |
          echo "dry-run 模式，没有提交任何改动"
          git diff --stat
